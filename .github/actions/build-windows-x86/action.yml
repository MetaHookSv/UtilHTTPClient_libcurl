name: Build Windows x86
description: Build and test Debug and Release, validate installation, and package Release.

outputs:
  archive-path:
    description: Absolute path to the Windows x86 Release 7z archive.
    value: ${{ steps.package.outputs.archive-path }}

runs:
  using: composite
  steps:
    - name: Build, test and install Debug
      shell: cmd
      run: call scripts\build-UtilHTTPClient_libcurl-x86-Debug.bat
    - name: Build, test and install Release
      shell: cmd
      run: call scripts\build-UtilHTTPClient_libcurl-x86-Release.bat
    - name: Package runtime
      id: package
      shell: pwsh
      run: ./scripts/Package-Windows.ps1
